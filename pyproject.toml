[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jason"
version = "0.1.0"
description = "HOA agent (virtual manager) — tasks, secrets, and orchestration for PayHOA and utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "keepersdk>=1.2",
    "python-dotenv>=1.0",
    "asspy",
    "payhoa",
    "smud",
    "idoxs",
    "pillow>=10",
    "pypdf>=5",
    # Zoom's times are UTC; Windows has no IANA database for zoneinfo to read the association's time zone from.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
mcp = [
    "mcp>=1.9",
]
charts = [
    "matplotlib>=3.8",
]
models = [
    "anthropic>=0.40",
]
# Claude on Amazon Bedrock for the contract-terms review (jason contract-terms --model bedrock): the Mantle client and
# the AWS credential chain. No AWS secret is stored by jason.
bedrock = [
    "anthropic[bedrock]>=1.11",
]
# QR codes: made for the links in letters, notices, and forms (segno), and read off ingested files (zxing-cpp; PDFs also
# need the pdf extra).
qr = [
    "segno>=1.6",
    "zxing-cpp>=2.2",
]
# OCR post-correction: a general English word list (and others, to name a passage's language) beside the legal
# corpus on disk; without it the corpus alone decides, and real words it lacks are "corrected" (docs/ocr-correction.md).
ocr = [
    "wordfreq>=3.1",
]
# PDF text for the utility-bill parsers and the document library (the parsers read PyMuPDF's layout).
pdf = [
    "pymupdf>=1.24",
]

# The board's web UI: a WSGI app (Flask) under a production server (waitress). Build the bundle in ui/ (npm).
web = [
    "flask>=3.0",
    "waitress>=3.0",
]

[project.scripts]
jason = "jason.cli:main"
jason-mcp = "jason.mcp.server:main"
jason-web = "jason.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jason"]
